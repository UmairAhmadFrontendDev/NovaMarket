<!DOCTYPE html>
<html>
<head>
    <title>Sign In</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>

<div class="login-box">

    <h1>Sign In</h1>

    <form>

        <label>Email</label>
        <input type="email" placeholder="Enter your email">

        <label>Password</label>
        <input type="password" placeholder="Enter password">

        <button type="submit">
            Sign In
        </button>

    </form>

    <p>
        New customer?
        <a href="#">Create your account</a>
    </p>

</div>

</body>
</html>
