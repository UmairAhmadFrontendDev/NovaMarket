<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Electronics Deals</title>
    <link rel="stylesheet" href="electronicdeal.css">
</head>
<body>
<section class="electronics-section">

    <h2>Today's Electronics Deals</h2>

    <div class="electronics-container">

        <div class="electronics-card">
            <img src="images/laptop.jpg" alt="">
            <h3>Laptop</h3>
            <p>Intel Core i7 Laptop</p>
            <span>$799</span>
        </div>

        <div class="electronics-card">
            <img src="images/headphone.jpg" alt="">
            <h3>Wireless Headphones</h3>
            <p>Noise Cancelling</p>
            <span>$99</span>
        </div>

        <div class="electronics-card">
            <img src="images/smartwatch.jpg" alt="">
            <h3>Smart Watch</h3>
            <p>Fitness Tracker</p>
            <span>$149</span>
        </div>

        <div class="electronics-card">
            <img src="images/speaker.jpg" alt="">
            <h3>Bluetooth Speaker</h3>
            <p>Portable Sound System</p>
            <span>$59</span>
        </div>

        <div class="electronics-card">
            <img src="images/tablet.jpg" alt="">
            <h3>Tablet</h3>
            <p>10-inch Android Tablet</p>
            <span>$249</span>
        </div>

        <div class="electronics-card">
            <img src="images/camera.jpg" alt="">
            <h3>Digital Camera</h3>
            <p>4K Ultra HD Camera</p>
            <span>$499</span>
        </div>

    </div>

</section>
</body>
</html>
